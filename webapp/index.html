<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Storage Capacity Dashboard — Kampong Speu Sugar</title>

	<!-- Inline so the app needs no extra asset request. -->
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230070f2'/%3E%3Crect x='7' y='16' width='18' height='10' fill='%23fff'/%3E%3Crect x='7' y='9' width='18' height='5' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">

	<!--
		The UI5 runtime is loaded from a co-deployed copy, which is what
		"npm start" (ui5 serve) and "npm run build" both provide, and what an
		on-premise SAPUI5 installation serves at /resources.

		To use the SAP CDN instead, replace the src below with:
		https://ui5.sap.com/1.120.27/resources/sap-ui-core.js
	-->
	<script
		id="sap-ui-bootstrap"
		src="resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout,sap.f"
		data-sap-ui-resource-roots='{"kss.spp": "./"}'
		data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
		data-sap-ui-compat-version="edge"
		data-sap-ui-async="true"
		data-sap-ui-frame-options="trusted">
	</script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
	<div
		data-sap-ui-component
		data-name="kss.spp"
		data-id="container"
		data-height="100%"
		data-settings='{"id": "kssSpp"}'>
	</div>
</body>
</html>
